[build-system]
requires = ["setuptools==72.2.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-cad"
version = "0.1.0"
description = "CAD ingestion, mass analysis, and API services for DronePilot."
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery==2.5.2",
  "fastapi==0.115.6",
  "numpy==2.2.1",
  "pydantic==2.10.4",
  "trimesh==4.5.3",
  "uvicorn[standard]==0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.8.6",
  "types-setuptools==75.6.0.20241223"
]

[project.scripts]
drone-cad = "drone_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
